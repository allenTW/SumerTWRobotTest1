<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具中心</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #171a23;
    --surface-2: #1f2330;
    --text: #e8e9ee;
    --text-dim: #9aa0b4;
    --accent: #d97757;
    --accent-soft: rgba(217, 119, 87, 0.15);
    --border: #2a2e3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  /* margin:auto 垂直置中，但內容比視窗高時不會把上緣切掉（align-items:center 會） */
  .wrap { width: 100%; max-width: 520px; padding: 32px 24px; margin: auto; }

  /* 鎖定畫面 */
  #lock-screen {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  #lock-screen h1 { font-size: 1.6rem; margin: 0 0 8px; }
  #lock-screen p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 24px; }
  #pw-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1.1rem;
    text-align: center;
    letter-spacing: 4px;
    margin-bottom: 12px;
  }
  #pw-submit {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  #pw-error {
    color: #e0685a;
    font-size: 0.85rem;
    margin-top: 12px;
    min-height: 1.2em;
  }

  /* 工具中心內容 */
  #hub { display: none; }
  #hub.show { display: block; }
  #hub h1 { font-size: 1.8rem; margin-bottom: 4px; }
  #hub .sub { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 28px; }
  .tool-card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    text-decoration: none;
    color: var(--text);
    margin-bottom: 16px;
    transition: border-color 0.15s;
  }
  .tool-card:hover { border-color: var(--accent); }
  .tool-card .title { color: var(--accent); font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
  .tool-card .desc { color: var(--text-dim); font-size: 0.9rem; }
  .lock-btn {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--text-dim);
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="wrap">

  <div id="lock-screen">
    <h1>🔒 工具中心</h1>
    <p>請輸入密碼以繼續</p>
    <input id="pw-input" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autofocus>
    <button id="pw-submit">解鎖</button>
    <div id="pw-error"></div>
  </div>

  <div id="hub">
    <h1>🧰 工具中心</h1>
    <div class="sub">所有工具、報告與說明文件的入口</div>

    <a class="tool-card" href="claude-code.html">
      <div class="title">📘 Claude Code 使用介紹</div>
      <div class="desc">安裝方式、核心功能、常用指令、詳細使用情境與範例、權限設定教學</div>
    </a>

    <a class="tool-card" href="crypto-reports.html">
      <div class="title">📊 加密貨幣報告</div>
      <div class="desc">自動化交易策略的回測結果與績效分析</div>
    </a>

    <a class="tool-card" href="claude-status.html">
      <div class="title">🖥 Claude 看板</div>
      <div class="desc">Mac mini 上 Claude Code / Cowork 工作階段的即時狀態、程式庫進度，每分鐘更新</div>
    </a>

    <span class="lock-btn" onclick="lockHub()">🔒 重新鎖定</span>
  </div>

</div>

<script>
  // 密碼驗證：只比對 SHA-256 雜湊值，網頁原始碼中不保存明碼密碼
  var PW_HASH = '36a71a5bca2513f92fc85544531b1605c3515ee5f6039882db0b17b05082652f';

  async function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    var buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(function(b) {
      return b.toString(16).padStart(2, '0');
    }).join('');
  }

  function showHub() {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('hub').classList.add('show');
  }

  function lockHub() {
    sessionStorage.removeItem('hub_token');
    document.getElementById('hub').classList.remove('show');
    document.getElementById('lock-screen').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }

  async function tryUnlock() {
    var input = document.getElementById('pw-input').value;
    var hash = await sha256Hex(input);
    if (hash === PW_HASH) {
      // 核發 token 給其他工具頁面驗證用，其他頁面沒有這個 token 就無法顯示內容
      sessionStorage.setItem('hub_token', PW_HASH);
      document.getElementById('pw-error').textContent = '';
      showHub();
    } else {
      document.getElementById('pw-error').textContent = '密碼錯誤，請再試一次';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  }

  document.getElementById('pw-submit').addEventListener('click', tryUnlock);
  document.getElementById('pw-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryUnlock();
  });

  // 同一個瀏覽器分頁 session 內，解鎖過就不用再輸入一次
  if (sessionStorage.getItem('hub_token') === PW_HASH) {
    showHub();
  }
</script>

</body>
</html>
